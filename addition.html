<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Addition of Two Numbers</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 350px;
            margin: 60px auto;
            background: #fff;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        h2 {
            text-align: center;
            margin-bottom: 24px;
        }
        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 8px;
        }
        input[type="number"] {
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 16px;
            border: 1px solid #bbb;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .result {
            text-align: center;
            margin-top: 18px;
            font-size: 18px;
            color: #333;
        }
    </style>
    <script>
        function addNumbers() {
            var num1 = parseFloat(document.getElementById("num1").value) || 0;
            var num2 = parseFloat(document.getElementById("num2").value) || 0;
            var sum = num1 + num2;
            document.getElementById("result").textContent = "Sum: " + sum;
        }
    </script>
</head>
<body>
    <div class="container">
        <h2>Addition of Two Numbers</h2>
        <label for="num1">First Number:</label>
        <input type="number" id="num1" name="num1">

        <label for="num2">Second Number:</label>
        <input type="number" id="num2" name="num2">

        <button type="button" onclick="addNumbers()">Add</button>

        <div class="result" id="result"></div>
    </div>
</body>
</html>
